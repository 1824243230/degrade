# Loaded after the selected sensor configuration, under /laserMapping.
localization:
  enabled: true
  map_path: ""                 # supplied by localization.launch
  metadata_path: ""            # supplied by localization.launch
  frame_id: map
  calibration_id: default      # must match the PCD sidecar and the active calibration
  map_sigma: 0.05
  kiss_resolution: 0.3
  fine_resolution: 0.15
  query_radius: 20.0
  tile_size: 80.0
  tile_stride: 40.0            # tile_size >= tile_stride + 2*query_radius
  min_inliers: 30
  min_query_points: 100
  threads: 2
  correspondence_distance: 0.5
  overlap_min: 0.60
  rmse_max: 0.20
  gravity_max_deg: 10.0
  observability_ratio: 0.00001
  verify_translation: 0.20
  verify_rotation_deg: 3.0
  ambiguity_overlap: 0.05
  ambiguity_rmse: 0.05
  match_timeout: 30.0
  retry_delay: 5.0
  max_attempts: 3
  stationary_seconds: 1.0
  stationary_frames: 5
  stationary_translation: 0.05
  stationary_rotation_deg: 1.0
  gyro_max: 0.05
  gyro_std_max: 0.01
  acc_std_max: 0.15
  sensor_timeout: 0.5
  bad_seconds: 0.5
  no_observation_seconds: 0.3
  low_lidar_seconds: 2.0
  good_seconds: 0.5
  recovering_seconds: 1.0
  recovering_frames: 10
  tracking_min_matches: 30
  good_min_matches: 50
  tracking_min_ratio: 0.10
  good_min_ratio: 0.20
  bad_rms: 0.30
  visual_q_min: 0.05
  max_position_variance: 3.0
  max_rotation_variance: 0.25
  reset_rotation_std_deg: 5.0
  reset_position_std: 0.2
  reset_velocity_std: 0.1
  reset_exposure_std: 0.1
  reset_gyro_bias_std: 0.01
  reset_acc_bias_std: 0.1
  reset_gravity_std: 0.1
  max_lidar_buffer: 30
  max_imu_buffer: 6000
lio:
  lag_smooth: 0
  map_insert_every: 1
local_map:
  map_sliding_en: false
pcd_save:
  pcd_save_en: false
common:
  velocity_init_en: false
uav:
  gravity_align_en: false
