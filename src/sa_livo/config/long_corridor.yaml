# ROS1 SA-LIVO equivalent of the supplied Super-LIO M2DGR configuration.
# Sensor calibration supplied by the user; original values are retained below.
common:
  lidar_topic: /livox/avia/lidar
  imu_topic: /livox/avia/imu
  image_topic: /camera/color/image_raw/compressed
  img_en: 1
  lidar_en: 1
  direct_bag_path: ""
extrin_calib:
  # p_I = R_IL * p_L + t_IL (laser_to_imu), translation in metres.
  # Rotations use the same nearest-SO(3) SVD correction as prepare_livo_dataset.py.
  extrinsic_T: [0.080000000, 0.029000000, 0.030000000]
  extrinsic_R: [0.999991859723, -0.000516138108, 0.004001760674,
                0.000519624185, 0.999999486419, -0.000870145088,
                -0.004001309504, 0.000872217416, 0.999991614344]
  # p_C = Rcl * p_L + Pcl; T_CL = inverse(T_IC) * T_IL.
  Rcl: [-0.021100446269, -0.999556884512, 0.020995375478,
         0.003617225929, -0.021076238708, -0.999771327774,
         0.999770817160, -0.021019676167, 0.004060341122]
  Pcl: [0.021313588207, -0.049438882760, -0.099277863986]

# Runtime camera for the rectified /camera_1/image_rect stream, using the same
# virtual K as prepare_livo_dataset.py: fx = gamma1/(1+xi), fy = gamma2/(1+xi).
# Distortion has already been removed by rectify_mei_bag; img_en controls use.
camera:
  model: Pinhole
  width: 640
  height: 480
  scale: 1.0
  fx: 295.34859328333215
  fy: 263.2644677709696
  cx: 319.6316274499249
  cy: 235.25773827438545
  d0: 0.0
  d1: 0.0
  d2: 0.0
  d3: 0.0

# Original calibration for provenance and MEI rectification. The mapper reads
# extrin_calib and camera above; this block is a reference, not a camera model.
calibration_reference:
  laser_to_imu:
    rows: 4
    cols: 4
    data: [0.999212900, -0.000519121, 0.004000000, 0.080000000,
           0.000516111, 0.999218492, -0.000939132, 0.029000000,
           -0.004000000, 0.000802565, 0.999993652, 0.030000000,
           0.000000000, 0.000000000, 0.000000000, 1.000000000]
  rgb_camera_to_imu:
    rows: 4
    cols: 4
    data: [-0.02050035, -0.00037277, 0.99978978, 0.17967550,
           -0.99958560, -0.02020440, -0.02050369, 0.04727031,
           0.02020780, -0.99979580, 0.00004158, -0.01985536,
           0.00000000, 0.00000000, 0.00000000, 1.00000000]
  rgb_camera:
    model_type: MEI
    camera_name: camera
    image_width: 640
    image_height: 480
    mirror_parameters:
      xi: 1.507983304667433
    distortion_parameters:
      k1: -0.07347781616721441
      k2: 0.24417387274492433
      p1: 0.0019232361081336904
      p2: 0.0014668219651531832
    projection_parameters:
      gamma1: 740.729341011609
      gamma2: 660.2628898817492
      u0: 319.6316274499249
      v0: 235.25773827438545
time_offset:
  imu_time_offset: 0.0
  img_time_offset: 0.0
  exposure_time_init: 0.0
preprocess:
  lidar_type: 2                 # SA-LIVO VELO16; Super-LIO uses 4 for Velodyne
  scan_line: 16
  scan_rate: 10
  blind: 2.0
  max_range: 150.0
  point_filter_num: 3
  feature_extract_enabled: false
  filter_size_surf: 0.5
  velodyne_time_scale: 1000.0    # float seconds -> curvature milliseconds
imu:
  imu_en: true
  imu_int_frame: 30
  # This recording starts in motion; wait for an IMU-stable window before mapping.
  stationary_init: true
  stationary_duration: 1.0
  stationary_gyro_max: 0.05
  stationary_acc_std: 0.10
  gravity_norm: 9.7946
  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
lio:
  max_iterations: 4
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0025
  voxel_size: 0.5
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]
  adaptive_support_en: true
  n_pca: 25
  planarity_ratio_th: 0.05
  min_eigen_abs: 0.01
  freeze_min_points: 50
  chi2_thres: 9.0
  multi_scale_en: true
  scale1_radius: 2.0
  max_shell: 6
saif:
  sigma_min: 1.0
  eps_pose_inflate: 0.01
  conv_phi_deg: 0.01
  conv_p_cm: 0.015
local_map:
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8.0
uav:
  imu_rate_odom: false
  gravity_align_en: true
publish:
  dense_map_en: true
  pub_effect_point_en: false
  pub_plane_en: false
  pub_scan_num: 5
evo:
  seq_name: "long_corridor_lio"
  pose_output_en: true
pcd_save:
  pcd_save_en: false
  colmap_output_en: false
  filter_size_pcd: 0.3
  interval: 500
evaluation:
  enabled: true
localization:
  enabled: false
